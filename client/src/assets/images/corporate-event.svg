<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#F9F5F0"/>
  
  <!-- Background decoration -->
  <rect width="800" height="600" fill="#F4F7F9"/>
  
  <!-- Conference table -->
  <ellipse cx="400" cy="450" rx="300" ry="100" fill="#5A4A42" opacity="0.2"/>
  <ellipse cx="400" cy="450" rx="280" ry="90" fill="#F9F5F0"/>
  
  <!-- Table decor -->
  <rect x="250" y="400" width="300" height="10" rx="5" fill="#2C5F2D" opacity="0.5"/>
  
  <!-- Plates, cups and items on table -->
  <!-- Left side -->
  <circle cx="200" cy="440" r="30" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
  <rect x="180" cy="400" width="40" height="30" rx="2" fill="#F1F1F1" stroke="#CCCCCC" stroke-width="1"/>
  
  <circle cx="280" cy="440" r="30" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
  <rect x="260" cy="400" width="40" height="30" rx="2" fill="#F1F1F1" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Right side -->
  <circle cx="520" cy="440" r="30" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
  <rect x="500" cy="400" width="40" height="30" rx="2" fill="#F1F1F1" stroke="#CCCCCC" stroke-width="1"/>
  
  <circle cx="600" cy="440" r="30" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
  <rect x="580" cy="400" width="40" height="30" rx="2" fill="#F1F1F1" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Center platter -->
  <ellipse cx="400" cy="430" rx="70" ry="40" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
  <ellipse cx="400" cy="430" rx="60" ry="30" fill="#F9F5F0"/>
  
  <!-- Food items on platter -->
  <circle cx="370" cy="420" r="10" fill="#FFB347"/>
  <circle cx="390" cy="415" r="8" fill="#CC704B"/>
  <circle cx="410" cy="410" r="12" fill="#2C5F2D"/>
  <circle cx="425" cy="425" r="9" fill="#8B5A2B"/>
  <circle cx="400" cy="435" r="7" fill="#CD853F"/>
  <circle cx="380" cy="440" r="10" fill="#FFB347"/>
  
  <!-- Projector screen -->
  <rect x="250" y="100" width="300" height="200" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="4"/>
  <rect x="270" y="120" width="260" height="160" fill="#2C5F2D" opacity="0.1"/>
  
  <!-- Screen content (simplified charts/graphs) -->
  <rect x="290" y="140" width="100" height="120" fill="#2C5F2D" opacity="0.3"/>
  <rect x="410" y="160" width="100" height="100" fill="#CC704B" opacity="0.3"/>
  <rect x="330" y="180" width="140" height="60" fill="#FFB347" opacity="0.3"/>
  
  <!-- Projector stand -->
  <rect x="390" y="300" width="20" height="50" fill="#555555"/>
  <polygon points="380,350 420,350 425,380 375,380" fill="#333333"/>
  
  <!-- People silhouettes around table (stylized) -->
  <!-- Left side people -->
  <circle cx="160" cy="440" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="150" y="460" width="20" height="40" rx="10" fill="#2C5F2D" opacity="0.7"/>
  
  <circle cx="240" cy="440" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="230" y="460" width="20" height="40" rx="10" fill="#2C5F2D" opacity="0.7"/>
  
  <circle cx="320" cy="440" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="310" y="460" width="20" height="40" rx="10" fill="#2C5F2D" opacity="0.7"/>
  
  <!-- Right side people -->
  <circle cx="480" cy="440" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="470" y="460" width="20" height="40" rx="10" fill="#2C5F2D" opacity="0.7"/>
  
  <circle cx="560" cy="440" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="550" y="460" width="20" height="40" rx="10" fill="#2C5F2D" opacity="0.7"/>
  
  <circle cx="640" cy="440" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="630" y="460" width="20" height="40" rx="10" fill="#2C5F2D" opacity="0.7"/>
  
  <!-- Presenter -->
  <circle cx="400" cy="340" r="25" fill="#CC704B" opacity="0.7"/>
  <rect x="387.5" y="365" width="25" height="50" rx="12.5" fill="#CC704B" opacity="0.7"/>
  <line x1="375" y1="380" x2="350" y2="360" stroke="#CC704B" stroke-width="5" opacity="0.7"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="150" r="40" fill="#FFB347" opacity="0.2"/>
  <circle cx="700" cy="200" r="50" fill="#2C5F2D" opacity="0.2"/>
  <circle cx="150" cy="550" r="30" fill="#CC704B" opacity="0.2"/>
</svg>