  <rect x="430" y="385" width="40" height="30" rx="5" fill="#FFB347" opacity="0.7"/>
  <rect x="435" y="390" width="30" height="20" rx="3" fill="#CC704B" opacity="0.5"/>
  
  <circle cx="390" cy="430" r="12" fill="#5A4A42" opacity="0.5"/>
  <circle cx="410" cy="430" r="12" fill="#5A4A42" opacity="0.5"/>
