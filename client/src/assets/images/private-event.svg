  <circle cx="250" cy="370" r="25" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <circle cx="320" cy="370" r="25" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
