  <rect x="250" y="150" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
  
  <!-- Window -->
  <rect x="300" y="160" width="80" height="80" fill="#E3F2FD"/>
  <path d="M300 200 L380 200" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M340 160 L340 240" stroke="#FFFFFF" stroke-width="2"/>
  
  <rect x="400" y="160" width="80" height="80" fill="#E3F2FD"/>
  <path d="M400 200 L480 200" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M440 160 L440 240" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Decorative elements -->
  <circle cx="650" cy="150" r="40" fill="#FFB347" opacity="0.2"/>
  <circle cx="150" cy="250" r="50" fill="#2C5F2D" opacity="0.2"/>
  <circle cx="700" cy="500" r="30" fill="#CC704B" opacity="0.2"/>
