  <circle cx="320" cy="460" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="310" y="480" width="20" height="30" fill="#2C5F2D" opacity="0.7"/>
  
  <circle cx="480" cy="460" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="470" y="480" width="20" height="30" fill="#2C5F2D" opacity="0.7"/>
  
  <circle cx="550" cy="460" r="20" fill="#2C5F2D" opacity="0.7"/>
  <rect x="540" y="480" width="20" height="30" fill="#2C5F2D" opacity="0.7"/>
  
