  <!-- Right side -->
  <circle cx="550" cy="370" r="25" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <circle cx="480" cy="370" r="25" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <circle cx="410" cy="370" r="25" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Wine glasses -->
  <path d="M250 335 L240 310 L260 310 Z" fill="#F0F0F0" opacity="0.5"/>
  <path d="M320 335 L310 310 L330 310 Z" fill="#F0F0F0" opacity="0.5"/>
  <path d="M390 335 L380 310 L400 310 Z" fill="#F0F0F0" opacity="0.5"/>
  <path d="M410 335 L400 310 L420 310 Z" fill="#F0F0F0" opacity="0.5"/>
  <path d="M480 335 L470 310 L490 310 Z" fill="#F0F0F0" opacity="0.5"/>
  <path d="M550 335 L540 310 L560 310 Z" fill="#F0F0F0" opacity="0.5"/>
  
  <!-- Food platters -->
  <ellipse cx="350" cy="400" rx="50" ry="30" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
